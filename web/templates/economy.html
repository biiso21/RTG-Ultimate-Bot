{% extends "base.html" %}

{% block title %}إدارة الاقتصاد - RTG Bot{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card shadow">
            <div class="card-header bg-warning text-dark">
                <h4><i class="fas fa-coins"></i> إدارة الاقتصاد</h4>
            </div>
            <div class="card-body">
                <h5>إضافة منتج جديد</h5>
                <form id="add-product-form">
                    <div class="mb-3">
                        <label>اسم المنتج</label>
                        <input type="text" id="product-name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>السعر (عملة)</label>
                        <input type="number" id="product-price" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>الرتبة (اختياري)</label>
                        <select id="product-role" class="form-control">
                            <option value="">لا يوجد</option>
                            {% for role in guild.roles %}
                                <option value="{{ role.id }}">{{ role.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>الوصف</label>
                        <textarea id="product-desc" class="form-control" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">إضافة المنتج</button>
                </form>
                
                <hr>
                
                <h5>قائمة المنتجات</h5>
                <div id="products-list"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
